  <script>
    (function () {
      var FPS = 30, q = 1 / FPS, D = 2.0;   /* host: global 4,00 → 6,00 */
      var tl = gsap.timeline({ paused: true });
      /* o cromo some nos 4 últimos quadros: o f04 começa com o vídeo limpo em tela cheia (mesmo timecode) */
      /* cada vídeo tem seu cromo (título, tempo, barra): troca seca no corte */
      var cortes = [0, 0.5, 1.0, 1.25, 1.5];
      var el = document.querySelectorAll("#root .f03-g");
      el.forEach(function (e) { gsap.set(e, { opacity: e.getAttribute("data-g") === "0" ? 1 : 0 }); });
      cortes.forEach(function (t, g) {
        if (g === 0) return;
        el.forEach(function (e) {
          var k = +e.getAttribute("data-g");
          if (k === g - 1) tl.set(e, { opacity: 0 }, t);
          if (k === g) tl.set(e, { opacity: 1 }, t);
        });
      });
      /* cada quadro respira (empurrão lento) enquanto está no ar; o último recua para 1,0 e casa com o f04 */
      var fim = [0.5, 1.0, 1.25, 1.5, 2.0];
      cortes.forEach(function (t, g) {
        var v = "#f03-v" + (g + 1);
        if (g < 4) tl.fromTo(v, { scale: 1 }, { scale: 1.045, duration: fim[g] - t, ease: "none" }, t);
        else tl.fromTo(v, { scale: 1.05 }, { scale: 1, duration: fim[g] - t, ease: "power2.out" }, t);
      });
      tl.to("#f03-cromo", { opacity: 0, duration: 4 * q, ease: "power1.in" }, D - 4 * q);
      tl.to({}, { duration: D }, 0);
      window.__timelines["f03-player"] = tl;
    })();
  </script>
